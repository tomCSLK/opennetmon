# /etc/opennetmon/config.toml - production configuration (all keys shown; update_check is off when the key is missing).
# Changes need `systemctl restart opennetmon`; the e-mail settings are edited in the web interface instead.

# Where the web interface listens: every IPv4 address of the server, port 8443, HTTPS only (open it with
# https://<server address>:8443; plain HTTP on the port is redirected). Open the port in the firewall if one is
# active (`sudo ufw allow 8443/tcp`). "[::]:8443" also accepts IPv6. Behind a reverse proxy instead
# (deploy/Caddyfile.example, deploy/nginx.conf.example): listen = "127.0.0.1:8080" and remove the two tls_ lines.
listen = "0.0.0.0:8443"

# Certificate for HTTPS. Created on installation by `opennetmon tls generate` (self-signed, valid for the
# host name and the IP addresses of the server, ten years). To use your own certificate, point these to it
# (PEM, server certificate first; key mode 0600, owned by opennetmon) - see docs/operations.md, "HTTPS".
tls_cert_file = "/etc/opennetmon/tls-cert.pem"
tls_key_file = "/etc/opennetmon/tls-key.pem"

database_path = "/var/lib/opennetmon/opennetmon.db"
log_filter = "info"                         # journalctl -u opennetmon; e.g. "info,opennetmon=debug"

# 64 hex characters, mode 0600, owned by the service user. Created by deploy/install.sh or the .deb package.
# BACK IT UP SEPARATELY from the database: without it the stored SNMP/SMTP passwords are unreadable.
secret_key_file = "/etc/opennetmon/secret.key"

cookie_secure = true                        # keep true with HTTPS; false only for plain-HTTP testing
session_ttl_hours = 168                     # absolute session lifetime
session_idle_minutes = 30                   # sign out after this time without activity; 0 = off

# Only behind a reverse proxy: tell the login throttling where the real client address is: "x-forwarded-for" (the last
# entry, appended by Caddy/nginx) or "x-real-ip". Only set it when the service is reachable through the proxy only;
# with built-in HTTPS the server sees the client address itself.
# client_ip_header = "x-forwarded-for"

poller_enabled = true
poll_concurrency = 16                       # devices polled at the same time

retention_raw_days = 7                      # raw measurements
retention_hourly_days = 365                 # hourly rollups and status events; daily rollups are kept forever
retention_audit_days = 365                  # audit log: changes by administrators, sign-ins

# Time zone of the weekly maintenance windows ("daily at 03:00"); unset = the zone of the system
# (`timedatectl`; Ubuntu servers often run in UTC). Names as in `timedatectl list-timezones`.
# time_zone = "Europe/Berlin"

# Look once a day on GitHub for a newer release and show "Version x.y.z available" to administrators in the sidebar.
# GitHub sees the address of this server once a day; nothing else is sent. Nothing is installed automatically.
update_check = true
