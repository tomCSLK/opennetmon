# Development configuration. Production lives in /etc/opennetmon/config.toml.
listen = "127.0.0.1:8080"
database_path = "./dev/data/opennetmon.db"
log_filter = "info,opennetmon=debug"
# Create with: cargo run -- --config ./dev/config.toml key generate
secret_key_file = "./dev/data/secret.key"
# Plain HTTP on localhost: session cookies cannot be Secure here.
cookie_secure = false
