[package]
name = "opennetmon"
version = "0.2.0"
edition = "2024"
description = "opennetmon – agentless SNMP network monitoring with a web interface"
authors = ["Thomas Cieslik"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomCSLK/opennetmon"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8", features = ["multipart"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4", features = ["derive"] }
fluent-bundle = "0.16"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
rand = "0.9"
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snmp2 = { version = "0.5", default-features = false, features = ["tokio", "crypto-rust", "heap_buffers"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
subtle = "2.6.1"
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
toml = "1.1.8"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = "0.9"

[dev-dependencies]
base64 = "0.23.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

# Argon2 is far too slow unoptimized; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Debian package: build it with dev/deb.sh (prepares target/deb-assets/, then runs cargo-deb).
[package.metadata.deb]
maintainer = "Thomas Cieslik <m.tomcs@gmail.com>"
copyright = "2026, Thomas Cieslik"
license-file = "LICENSE"
extended-description = """\
Agentless network monitoring over SNMP (v2c, v3) and ping with a web interface: devices, groups, \
sensors with thresholds, graphs and e-mail alerts. A single static binary with an SQLite database, \
run as a hardened systemd service behind a TLS reverse proxy."""
section = "net"
priority = "optional"
depends = "passwd"
maintainer-scripts = "deploy/deb/"
assets = [
    ["target/release/opennetmon", "usr/bin/", "755"],
    ["target/deb-assets/opennetmon-backup", "usr/sbin/", "755"],
    ["deploy/config.example.toml", "etc/opennetmon/config.toml", "640"],
    ["target/deb-assets/opennetmon.service", "usr/lib/systemd/system/", "644"],
    ["target/deb-assets/opennetmon-backup.service", "usr/lib/systemd/system/", "644"],
    ["deploy/opennetmon-backup.timer", "usr/lib/systemd/system/", "644"],
    ["deploy/99-opennetmon-ping.conf", "usr/lib/sysctl.d/", "644"],
    ["THIRD-PARTY-LICENSES.txt", "usr/share/doc/opennetmon/", "644"],
    ["README.md", "usr/share/doc/opennetmon/", "644"],
    ["deploy/Caddyfile.example", "usr/share/doc/opennetmon/examples/", "644"],
    ["deploy/nginx.conf.example", "usr/share/doc/opennetmon/examples/", "644"],
]
# Enabled, but not started on the first installation (there is no administrator yet); restarted on upgrades
# if running. The backup timer is started by postinst.
systemd-units = [
    { unit-name = "opennetmon", enable = true, start = false, restart-after-upgrade = true },
    { unit-name = "opennetmon-backup", enable = true, start = false, restart-after-upgrade = true },
]
