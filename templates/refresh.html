{# Refresh control of pages with live status (static/refresh.js): reload now, or every 60 s. -#}
<div class="refresh" data-refresh>
  <label class="refresh-auto" title="{{ t.get("refresh-auto-title") }}" hidden><input type="checkbox" data-refresh-auto> {{ t.get("refresh-auto") }}<span class="refresh-left" data-refresh-left></span></label>
  <a class="button secondary icon-only" href="" data-refresh-now title="{{ t.get("refresh") }}" aria-label="{{ t.get("refresh") }}">
    {{ crate::web::icon("refresh", "")|safe }}
  </a>
</div>
