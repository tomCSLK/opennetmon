{# Refresh control of pages with live status (static/refresh.js): reload now, or every 30 s (a switch, as in the draft). -#}
<div class="refresh" data-refresh>
  <label class="switch refresh-auto" title="{{ t.get("refresh-auto-title") }}" hidden><input type="checkbox" role="switch" data-refresh-auto><span>{{ t.get("refresh-auto") }}<span class="refresh-left" data-refresh-left></span></span></label>
  <a class="button ghost icon-only" href="" data-refresh-now title="{{ t.get("refresh") }}" aria-label="{{ t.get("refresh") }}">
    {{ crate::web::icon("refresh", "")|safe }}
  </a>
</div>
