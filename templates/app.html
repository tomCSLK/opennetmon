{% extends "base.html" %}
{% block body %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg></span>
      netmon
    </a>
    <button type="button" class="menu-toggle" aria-expanded="false" aria-label="Menü">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <nav class="nav" aria-label="Hauptnavigation">
      <div class="nav-label">Monitoring</div>
      <a href="/" data-match="/ /devices /groups /sensors">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Übersicht
      </a>
      {% if layout.is_admin %}
      <div class="nav-label">Einstellungen</div>
      <a href="/credentials" data-match="/credentials">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><line x1="10.8" y1="12.2" x2="20" y2="3"/><line x1="17" y1="6" x2="20" y2="9"/><line x1="15" y1="8" x2="17" y2="10"/></svg>
        SNMP-Profile
      </a>
      <a href="/settings/mail" data-match="/settings/mail">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
        E-Mail
      </a>
      {% endif %}
    </nav>
    <div class="sidebar-foot">
      <div class="user">
        <span class="avatar" aria-hidden="true">{{ layout.initial() }}</span>
        <div>
          <div class="user-name">{{ layout.username }}</div>
          <div class="user-role">{{ layout.role_label }}</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button type="button" class="side-button" data-theme-toggle aria-label="Design umschalten">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <span class="label">Design</span>
        </button>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}">
          <button type="submit" class="side-button" aria-label="Abmelden">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><polyline points="10 17 5 12 10 7"/><line x1="5" y1="12" x2="15" y2="12"/></svg>
            Abmelden
          </button>
        </form>
      </div>
    </div>
  </aside>
  <main class="content">
    <div class="page{% block page_class %}{% endblock %}">
{% block content %}{% endblock %}
    </div>
  </main>
</div>
{% endblock %}
