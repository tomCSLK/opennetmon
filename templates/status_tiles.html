{# Status tiles of the overview and the status lists (needs `tiles`). -#}
<section class="tiles" aria-label="{{ t.get("overview-sensor-status") }}">
  {% for tile in tiles %}
  <a class="tile{{ tile.class }}" href="{{ tile.href }}"{% if tile.current %} aria-current="page"{% endif %}><div class="tile-value">{{ tile.count }}</div><div class="tile-label">{{ tile.label }}</div></a>
  {% endfor %}
</section>
