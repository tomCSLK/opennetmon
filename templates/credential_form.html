{% extends "app.html" %}
{% block title %}{{ heading }} – netmon{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ heading }}</h1>
  {% if let Some(message) = error %}
  <p class="error" role="alert">{{ message }}</p>
  {% endif %}
  <form method="post" action="{{ action }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}">

    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ form.name }}" required maxlength="64">

    <label for="version">SNMP-Version</label>
    <select id="version" name="version">
      {% for v in versions %}
      <option value="{{ v.as_str() }}"{% if form.version == v.as_str() %} selected{% endif %}>{{ v.label() }}</option>
      {% endfor %}
    </select>

    <fieldset>
      <legend>Nur SNMPv2c</legend>
      <label for="community">Community</label>
      <input id="community" name="community" type="password" autocomplete="off" maxlength="128"
             placeholder="{% if community_set %}gesetzt – leer lassen zum Beibehalten{% endif %}">
    </fieldset>

    <fieldset>
      <legend>Nur SNMPv3</legend>
      <label for="username">Benutzer</label>
      <input id="username" name="username" type="text" value="{{ form.username }}" autocomplete="off" maxlength="32">

      <label for="level">Sicherheitsstufe</label>
      <select id="level" name="level">
        {% for l in levels %}
        <option value="{{ l.as_str() }}"{% if form.level == l.as_str() %} selected{% endif %}>{{ l.label() }}</option>
        {% endfor %}
      </select>

      <label for="auth_protocol">Authentifizierung</label>
      <select id="auth_protocol" name="auth_protocol">
        {% for p in auth_protocols %}
        <option value="{{ p.as_str() }}"{% if form.auth_protocol == p.as_str() %} selected{% endif %}>{{ p.label() }}</option>
        {% endfor %}
      </select>

      <label for="auth_password">Authentifizierungs-Passwort</label>
      <input id="auth_password" name="auth_password" type="password" autocomplete="new-password" maxlength="128"
             placeholder="{% if auth_password_set %}gesetzt – leer lassen zum Beibehalten{% endif %}">

      <label for="priv_protocol">Verschlüsselung (nur authPriv)</label>
      <select id="priv_protocol" name="priv_protocol">
        <option value="">–</option>
        {% for p in priv_protocols %}
        <option value="{{ p.as_str() }}"{% if form.priv_protocol == p.as_str() %} selected{% endif %}>{{ p.label() }}</option>
        {% endfor %}
      </select>

      <label for="priv_password">Verschlüsselungs-Passwort (nur authPriv)</label>
      <input id="priv_password" name="priv_password" type="password" autocomplete="new-password" maxlength="128"
             placeholder="{% if priv_password_set %}gesetzt – leer lassen zum Beibehalten{% endif %}">
    </fieldset>

    <button type="submit">Speichern</button>
  </form>

  {% if let Some(delete_action) = delete_action %}
  <form method="post" action="{{ delete_action }}" class="delete">
    <input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}">
    <label class="inline"><input type="checkbox" name="confirm" value="yes" required> Ja, dieses Profil löschen</label>
    <button type="submit" class="danger">Profil löschen</button>
  </form>
  {% endif %}
</div>
{% endblock %}
