# Settings for `cargo audit` (RustSec advisory database).
[advisories]
ignore = [
    # rsa (Marvin timing attack, no fixed version): only listed in Cargo.lock as a dependency of
    # sqlx-mysql, which sqlx records there but never builds for this crate (`cargo tree -i sqlx-mysql
    # --target all -e all` prints nothing). Recheck when sqlx changes.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30 bundles SQLite before 3.54.0, which can return stale memory when it opens a database
    # together with a crafted `-wal` file of another page size. opennetmon opens only its own database
    # (`database_path`, /var/lib/opennetmon in the package), written by the service user alone; whoever can plant
    # files there can change the database anyway. No sqlx release accepts the fixed libsqlite3-sys 0.39 yet
    # (sqlx 0.8 needs 0.30, sqlx 0.9.0 < 0.38). Remove once one does. Same exception as in opensecmon.
    "RUSTSEC-2026-0459",
]
